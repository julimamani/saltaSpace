# The stack runs on the Avalanche L1 (chainId 500301, AvaCloud managed).
#   docker compose up -d --build
# Front: http://localhost:4000 · API: http://localhost:8000/docs
#
# Chain config comes from the project .env (compose substitution) or the defaults below.
# For the local Hardhat demo instead (chainId 31337):
#   RPC_URL=http://hardhat:8545 CHAIN_NETWORK=localhost ORACLE_PRIVATE_KEY=<hardhat #0> \
#     docker compose --profile local up -d --build
# and open the front with ?chain=31337.
services:
  hardhat:
    profiles: ["local"]
    build: ./contracts
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\"}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 20

  deployer:
    profiles: ["local"]
    build: ./contracts
    depends_on:
      hardhat: { condition: service_healthy }
    environment:
      LOCAL_RPC_URL: http://hardhat:8545
    # Addresses on a fresh Hardhat node are deterministic, so the exported files match the committed ones.
    volumes:
      - ./backend/app/chain:/repo/backend/app/chain
      - ./front/src/app/web3/generated:/repo/front/src/app/web3/generated
    command: sh -c "npx hardhat run scripts/deploy.ts --network localhost && npx hardhat run scripts/seed-demo.ts --network localhost"
    restart: "no"

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Avalanche L1 (AvaCloud managed). Override on the command line or in .env for local.
      RPC_URL: ${RPC_URL:-https://managed-nodes.avax.network/ext/bc/25q34oCrUpLtwMWfnkCcfcKiH6ec84npvtSBy1bLGRyN4KiizF/rpc}
      CHAIN_NETWORK: ${CHAIN_NETWORK:-l1}
      # Wallet with ORACLE_ROLE on the L1 (needs gas token). Set it in .env — never commit a real key.
      ORACLE_PRIVATE_KEY: ${ORACLE_PRIVATE_KEY:?set ORACLE_PRIVATE_KEY in .env (the L1 deployer/oracle wallet)}
      ENABLE_SCHEDULER: "true"
      ORACLE_INTERVAL_MINUTES: "30"
      CORS_ORIGINS: http://localhost:4000,http://localhost:4200,http://127.0.0.1:4000
      DATABASE_PATH: /data/orbitag.db
    volumes:
      - ./backend/app/chain:/app/app/chain:ro
      - backend-data:/data

  front:
    build: ./front
    depends_on: [backend]
    ports: ["4000:4000"]

volumes:
  backend-data:
